<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#020203">
<title>VB | Powered by Vladskuy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <section class="banner" aria-label="VB Powered by Vladskuy">
    <svg class="bv" viewBox="0 0 400 200" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
      <g class="bgl" id="bg2"></g><g class="bl" id="bl"></g><g class="bs" id="b0"></g><g class="bs b1" id="b1"></g>
    </svg>
    <img class="mascot" src="gambar/maskot.webp" alt="">
    <div class="bc">
      <img class="logo" src="gambar/logo.png" alt="VB">
      <div class="bn">POWERED BY VLADSKUY</div>
      <div class="rule"></div>
      <div class="tag">AI Content Studio</div>
      <div class="tag2">Make Your Ideas Come True</div>
    </div>
  </section>
  <p class="lead">Choose Your Module and Start Creating</p>
  <div class="grid" id="grid"></div>
  <footer>VB &middot; AI CONTENT SUITE</footer>
</main>
<script src="data.js"></script>
<script src="bg.js"></script>
<script>
MODULES.forEach((m, i) => {
  const a = document.createElement("a");
  a.className = "card"; a.href = "modul.html?m=" + (i + 1); a.style.setProperty("--i", i);
  a.innerHTML = "<small></small><strong></strong><span></span>";
  a.children[0].textContent = m.no; a.children[1].textContent = m.nama; a.children[2].textContent = m.desc;
  document.getElementById("grid").appendChild(a);
});
</script>
</body>
</html>
