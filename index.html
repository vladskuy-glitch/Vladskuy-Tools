<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#020203">
<title>VB | Vladskuy Tools</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--gold:#d4af37;--gold2:#e8c460;--text:#ece6d6;--muted:#a89f88;--line:rgba(212,175,55,.32)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:#020203}
body{margin:0;color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.5;min-height:100vh}
body.lock{overflow:hidden}
button{touch-action:manipulation}

/* Background: marble hitam + urat emas (3 lapisan terpisah supaya ringan) */
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden;background:
 radial-gradient(ellipse at 20% 15%,#0e0e12 0,transparent 55%),
 radial-gradient(ellipse at 80% 70%,#0b0b0f 0,transparent 50%),
 radial-gradient(ellipse at 50% 105%,#08080b 0,transparent 60%),#020203}
.bg::before{content:"";position:absolute;inset:-25%;will-change:transform;background:
 radial-gradient(ellipse at 30% 40%,rgba(255,255,255,.025) 0,transparent 40%),
 radial-gradient(ellipse at 70% 20%,rgba(212,175,55,.04) 0,transparent 35%);
 animation:drift 40s ease-in-out infinite alternate}
.bg::after{content:"";position:absolute;inset:0;background:
 repeating-linear-gradient(60deg,rgba(255,255,255,.01) 0 1px,transparent 1px 96px),
 repeating-linear-gradient(-60deg,rgba(255,255,255,.01) 0 1px,transparent 1px 96px)}
.bg svg{position:absolute;inset:0;width:100%;height:100%}
.gl{will-change:opacity;animation:pulse 6s ease-in-out infinite}
.sp{will-change:transform}
.line{fill:none;stroke:url(#g);stroke-width:.45;stroke-linecap:round;stroke-linejoin:round;opacity:.85}
.glow{fill:none;stroke:#d4a72c;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.spark{fill:none;stroke:#f2c94c;stroke-width:.8;stroke-linecap:round;stroke-dasharray:64 436;animation:run 2s linear infinite}
@keyframes run{from{stroke-dashoffset:500}to{stroke-dashoffset:0}}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:.8}}
@keyframes drift{to{transform:translate3d(4%,3%,0) scale(1.08)}}

/* Layout */
main{max-width:760px;margin:0 auto;padding:28px 18px 56px}
.lead{text-align:center;color:var(--muted);margin:0 0 20px;font-size:.95rem}

/* Banner */
.banner{position:relative;display:flex;align-items:center;height:210px;margin-bottom:26px;overflow:hidden;
 border:1px solid var(--line);border-radius:14px;background:rgba(5,5,8,.8);animation:rise .7s both}
.banner::before{content:"";position:absolute;inset:6px;border:1px solid rgba(212,175,55,.2);border-radius:9px;pointer-events:none;z-index:3}
.banner::after{content:"";position:absolute;top:0;bottom:0;left:0;width:38%;pointer-events:none;z-index:4;
 background:linear-gradient(100deg,transparent,rgba(232,196,96,.16),transparent);
 transform:translateX(-160%) skewX(-18deg);animation:sweep 7s ease-in-out infinite}
@keyframes sweep{0%,55%{transform:translateX(-160%) skewX(-18deg)}100%{transform:translateX(380%) skewX(-18deg)}}
.bv{position:absolute;inset:0;width:100%;height:100%;z-index:1}
.bl{fill:none;stroke:#c9a227;stroke-width:.5;stroke-linecap:round;stroke-linejoin:round;opacity:.8}
.bgl{fill:none;stroke:#d4a72c;stroke-width:2.2;stroke-linecap:round;opacity:.22}
.bs{fill:none;stroke:#f2c94c;stroke-width:.9;stroke-linecap:round;stroke-dasharray:64 436;animation:run 1.8s linear infinite}
.bs.b1{animation-duration:2.2s;animation-delay:-.9s}
.mascot{position:relative;z-index:2;height:100%;width:auto;max-width:44%;object-fit:contain;object-position:left bottom;align-self:flex-end;
 -webkit-mask-image:linear-gradient(90deg,#000 82%,transparent);mask-image:linear-gradient(90deg,#000 82%,transparent)}
.bc{position:relative;z-index:2;flex:1;text-align:center;padding:0 14px}
.logo{display:block;margin:0 auto 6px;height:54px;width:auto;filter:drop-shadow(0 0 12px rgba(212,175,55,.45))}
.bn{font-family:Cinzel,Georgia,serif;font-size:.72rem;letter-spacing:.34em;color:var(--gold)}
.rule{width:90px;height:1px;margin:9px auto;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.tag{font-family:Cinzel,Georgia,serif;font-weight:700;font-size:1.05rem;letter-spacing:.06em;color:var(--gold2)}
.tag2{color:var(--muted);font-size:.78rem;margin-top:2px}

/* Kartu modul */
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:720px){.grid{grid-template-columns:repeat(4,1fr);gap:14px}}
.card{font:inherit;color:inherit;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:4px;
 min-height:118px;padding:16px 14px;border:1px solid var(--line);border-radius:10px;background:rgba(8,8,11,.84);
 transition:border-color .25s,box-shadow .25s,transform .25s;animation:rise .6s both;animation-delay:calc(var(--i)*60ms + 150ms)}
.card small{font-family:Cinzel,Georgia,serif;color:var(--gold);letter-spacing:.2em;font-size:.75rem}
.card strong{font-size:1rem;font-weight:600;color:var(--gold2)}
.card span{color:var(--muted);font-size:.82rem}
.card:hover,.card:focus-visible{border-color:var(--gold);box-shadow:0 0 22px rgba(212,175,55,.22);transform:translateY(-2px);outline:none}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
footer{text-align:center;color:var(--muted);font-size:.78rem;margin-top:36px;letter-spacing:.12em}

/* Panel */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.65);opacity:0;visibility:hidden;transition:opacity .3s,visibility .3s;z-index:10}
.panel{position:fixed;left:0;right:0;bottom:0;max-width:640px;margin:0 auto;max-height:78vh;overflow:auto;z-index:11;
 background:#0b0b0f;border:1px solid var(--line);border-bottom:0;border-radius:16px 16px 0 0;padding:20px 18px 28px;
 visibility:hidden;transform:translateY(100%);transition:transform .3s,visibility .3s}
.open .overlay{opacity:1;visibility:visible}
.open .panel{visibility:visible;transform:none}
.ph{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.ph h2{font-family:Cinzel,Georgia,serif;font-size:1.1rem;font-weight:700;margin:0;color:var(--gold2);letter-spacing:.08em}
.x{font:inherit;color:var(--gold);background:none;border:1px solid var(--line);border-radius:8px;padding:6px 12px;cursor:pointer}
.x:focus-visible,.item:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.item{display:block;text-decoration:none;color:inherit;border:1px solid var(--line);border-left:3px solid var(--gold);border-radius:8px;padding:12px 14px;margin-bottom:10px;background:rgba(255,255,255,.02)}
.item strong{display:block;color:var(--gold2)}
.item span{color:var(--muted);font-size:.85rem}
a.item:hover{background:rgba(212,175,55,.08)}
.soon{opacity:.55}
.empty{color:var(--muted)}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="bg" aria-hidden="true">
<svg viewBox="0 0 400 800" preserveAspectRatio="xMidYMid slice">
<defs>
<linearGradient id="g" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="400" y2="800">
<stop offset="0" stop-color="#7a5a14"/><stop offset=".5" stop-color="#d4a82c"/><stop offset="1" stop-color="#a67c1a"/>
</linearGradient>
<g id="m0"></g><g id="m1"></g><g id="m2"></g><g id="m3"></g><g id="m4"></g><g id="m5"></g><g id="mc"></g>
<g id="v"><use href="#m0"/><use href="#m1"/><use href="#m2"/><use href="#m3"/><use href="#m4"/><use href="#m5"/><use href="#mc"/></g>
</defs>
<use href="#v" class="line"/>
</svg>
<svg class="gl" viewBox="0 0 400 800" preserveAspectRatio="xMidYMid slice">
<defs><filter id="b"><feGaussianBlur stdDeviation="2"/></filter></defs>
<use href="#v" class="glow" filter="url(#b)"/>
</svg>
<svg class="sp" viewBox="0 0 400 800" preserveAspectRatio="xMidYMid slice">
<use href="#m0" class="spark" style="animation-duration:1.5s;animation-delay:-.2s"/>
<use href="#m1" class="spark" style="animation-duration:1.8s;animation-delay:-.9s"/>
<use href="#m2" class="spark" style="animation-duration:2.2s;animation-delay:-1.4s"/>
<use href="#m3" class="spark" style="animation-duration:1.65s;animation-delay:-.6s"/>
<use href="#m4" class="spark" style="animation-duration:1.95s;animation-delay:-1.1s"/>
<use href="#m5" class="spark" style="animation-duration:2.15s;animation-delay:-.4s"/>
</svg>
</div>

<main>
  <section class="banner" aria-label="VB Vladskuy Tools">
    <svg class="bv" viewBox="0 0 400 200" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
      <g class="bgl" id="bg2"></g><g class="bl" id="bl"></g><g class="bs" id="b0"></g><g class="bs b1" id="b1"></g>
    </svg>
    <img class="mascot" src="gambar/maskot.webp" alt="">
    <div class="bc">
      <img class="logo" src="gambar/logo.png" alt="VB">
      <div class="bn">VLADSKUY TOOLS</div>
      <div class="rule"></div>
      <div class="tag">AI Content Studio</div>
      <div class="tag2">Dari ide hingga siap tayang</div>
    </div>
  </section>
  <p class="lead">Pilih modul untuk mulai berkarya.</p>
  <div class="grid" id="grid"></div>
  <footer>VB &middot; AI CONTENT SUITE</footer>
</main>

<div id="wrap">
  <div class="overlay" id="ov"></div>
  <section class="panel" id="panel" role="dialog" aria-modal="true" aria-labelledby="pt">
    <div class="ph"><h2 id="pt"></h2><button class="x" id="cl" type="button">Tutup</button></div>
    <div id="pl"></div>
  </section>
</div>

<script>
/* ===== EDIT DI SINI =====
   Tiap modul punya daftar tool (items). Isi link dengan link Gemini kamu.
   link kosong ("") = tampil "Segera hadir". */
const modules = [
  {no:"01", nama:"Factory Content", desc:"Produksi konten dalam satu alur", items:[]},
  {no:"02", nama:"Image Generator", desc:"Bikin gambar dari ide kamu", items:[
    {nama:"Image Generator", ket:"Prompt dan gambar langsung jadi", link:""}
  ]},
  {no:"03", nama:"Video Generator", desc:"Ubah ide jadi video", items:[]},
  {no:"04", nama:"Modifying Character", desc:"Ubah dan atur karakter AI", items:[]},
  {no:"05", nama:"Music Clip", desc:"Susun adegan klip musik", items:[]},
  {no:"06", nama:"Short Drama", desc:"Skrip drama pendek per adegan", items:[]},
  {no:"07", nama:"Prompt Siap Pakai", desc:"Prompt tinggal salin", items:[
    {nama:"Prompt Siap Pakai", ket:"Prompt gambar, video, dan konten", link:"https://gemini.google.com/gem/1L8w-cciPXYV0A2CUv0vNWoKCU8Ij-nN4?usp=sharing"}
  ]},
  {no:"08", nama:"Studio Content", desc:"Ruang kerja konten lengkap", items:[]}
];
/* ===== SELESAI ===== */

/* Urat emas acak (tetap sama tiap dibuka) */
(function () {
  let seed = 23;
  const r = () => (seed = seed * 16807 % 2147483647) / 2147483647;
  const NS = "http://www.w3.org/2000/svg", $e = id => document.getElementById(id);
  function path(x, y, a, len, n, j) {
    let d = "M" + x.toFixed(1) + " " + y.toFixed(1), p = [[x, y, a]];
    for (let i = 0; i < n; i++) {
      a += (r() - .5) * j; x += Math.cos(a) * len / n; y += Math.sin(a) * len / n;
      d += "L" + x.toFixed(1) + " " + y.toFixed(1); p.push([x, y, a]);
    }
    return { d, p };
  }
  function add(g, d, op) {
    const e = document.createElementNS(NS, "path");
    e.setAttribute("d", d); e.setAttribute("pathLength", "1000");
    if (op) e.setAttribute("opacity", op);
    g.appendChild(e);
  }
  const M = [0, 1, 2, 3, 4, 5].map(i => $e("m" + i)), C = $e("mc");
  for (let i = 0; i < 34; i++) {
    const n = 14 + (r() * 10 | 0);
    const v = path(r() * 460 - 30, r() * 860 - 30, r() * 6.283, 300 + r() * 500, n, 1.1);
    add(M[i % 6], v.d);
    for (let b = 0; b < 2; b++) {
      const q = v.p[3 + (r() * (n - 6) | 0)];
      const w = path(q[0], q[1], q[2] + (r() < .5 ? -1 : 1) * (.5 + r() * .8), 80 + r() * 130, 6 + (r() * 4 | 0), 1.1);
      add(C, w.d, .6);
    }
  }
  /* Urat memancar dari logo di banner */
  function banner(cx) {
    ["bg2", "bl", "b0", "b1"].forEach(id => $e(id).textContent = "");
    for (let i = 0; i < 18; i++) {
      const a = i / 18 * 6.283 + (r() - .5) * .5;
      const v = path(cx, 72, a, 110 + r() * 130, 8 + (r() * 4 | 0), .8);
      add($e("bg2"), v.d); add($e("bl"), v.d); add($e(i % 2 ? "b1" : "b0"), v.d);
      if (r() < .6) {
        const q = v.p[3 + (r() * 4 | 0)];
        const w = path(q[0], q[1], q[2] + (r() < .5 ? -1 : 1) * (.6 + r() * .6), 40 + r() * 60, 5, .9);
        add($e("bl"), w.d, .6);
      }
    }
  }
  const m = document.querySelector(".mascot"), bn = document.querySelector(".banner");
  const noM = () => { m.remove(); bn.classList.add("nomascot"); banner(200); };
  if (m.complete) { m.naturalWidth ? banner(280) : noM(); }
  else { m.addEventListener("load", () => banner(280)); m.addEventListener("error", noM); }
})();

const $ = id => document.getElementById(id);
const wrap = $("wrap"), list = $("pl");
let last = null;

modules.forEach((m, i) => {
  const b = document.createElement("button");
  b.type = "button"; b.className = "card"; b.style.setProperty("--i", i);
  b.innerHTML = "<small></small><strong></strong><span></span>";
  b.children[0].textContent = m.no;
  b.children[1].textContent = m.nama;
  b.children[2].textContent = m.desc;
  b.onclick = () => openPanel(m, b);
  $("grid").appendChild(b);
});

function openPanel(m, btn) {
  last = btn;
  $("pt").textContent = m.nama;
  list.innerHTML = "";
  if (!m.items.length) {
    const p = document.createElement("p");
    p.className = "empty"; p.textContent = "Panel ini sedang disiapkan.";
    list.appendChild(p);
  }
  m.items.forEach(t => {
    const el = document.createElement(t.link ? "a" : "div");
    el.className = "item" + (t.link ? "" : " soon");
    if (t.link) { el.href = t.link; el.target = "_blank"; el.rel = "noopener"; }
    el.innerHTML = "<strong></strong><span></span>";
    el.children[0].textContent = t.nama;
    el.children[1].textContent = t.link ? t.ket : "Segera hadir";
    list.appendChild(el);
  });
  wrap.classList.add("open");
  document.body.classList.add("lock");
  $("cl").focus();
}
function closePanel() {
  wrap.classList.remove("open");
  document.body.classList.remove("lock");
  if (last) last.focus();
}
$("cl").onclick = closePanel;
$("ov").onclick = closePanel;
document.addEventListener("keydown", e => { if (e.key === "Escape") closePanel(); });
</script>
</body>
</html>
