<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VB Prompt Studio</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#050506;--card:#0d0d10;--in:#141418;--line:rgba(212,175,55,.32);--tx:#ece8dc;--mu:#9a927e;--ac:#d4af37;--acx:#0a0a0c;--rd:#ff7a7a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg) repeating-linear-gradient(45deg,rgba(212,175,55,.045) 0 1px,transparent 1px 28px),repeating-linear-gradient(-45deg,rgba(212,175,55,.045) 0 1px,transparent 1px 28px);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
h1,h2{font-family:Oswald,Impact,"Arial Narrow",sans-serif;margin:0;letter-spacing:.02em}
header{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:center;padding:18px 20px;border-bottom:1px solid var(--line)}
h1{font-size:30px}h1 b{color:var(--ac);font-size:36px;margin-right:6px}
header p{margin:0;color:var(--mu);font-size:13px;max-width:60ch}
.seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--line);background:var(--in);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:none;color:var(--mu);padding:7px 14px;border-radius:8px;font:600 14px inherit;cursor:pointer}
.seg button.on{background:var(--ac);color:var(--acx)}
main{display:grid;grid-template-columns:minmax(300px,480px) 1fr;gap:18px;padding:18px 20px;max-width:1400px;margin:auto}
@media(max-width:820px){main{grid-template-columns:1fr}}
section{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
h2{font-size:19px;color:var(--ac);margin-bottom:12px}
label{display:block;font-size:13px;color:var(--mu);margin:10px 0 4px}
input,textarea,select{width:100%;background:var(--in);color:var(--tx);border:1px solid var(--line);border-radius:9px;padding:9px 11px;font:inherit}
textarea{min-height:64px;resize:vertical}
input:focus,textarea:focus,select:focus,button:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.item{background:var(--in);border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:10px}
.item input,.item textarea{background:var(--card);margin-bottom:6px}
.top{display:flex;gap:8px}.top input{flex:1}
.del{background:none;border:1px solid var(--line);color:var(--rd);border-radius:8px;padding:0 10px;cursor:pointer;font:600 13px inherit}
.add{width:100%;background:none;border:1px dashed var(--line);color:var(--ac);border-radius:9px;padding:9px;font:700 14px inherit;cursor:pointer}
.btn{background:var(--ac);color:var(--acx);border:1px solid var(--ac);border-radius:10px;padding:11px 16px;font:700 15px inherit;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ac);border:1px solid var(--line)}
.btn:disabled{opacity:.5;cursor:wait}
.sw{display:flex;gap:10px;align-items:center;cursor:pointer;color:var(--tx);font-size:14px;margin:0}
.sw input{width:auto}
.note{font-size:12.5px;color:var(--mu);margin:6px 0 0}
.out{position:sticky;top:12px}
#out{min-height:380px;font:13px/1.55 ui-monospace,Menlo,Consolas,monospace;white-space:pre-wrap}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin-bottom:10px}
.bar div{display:flex;gap:8px}
.hide{display:none!important}
.dz{border:1px dashed var(--ac);border-radius:10px;padding:14px;text-align:center;color:var(--mu);cursor:pointer;margin-top:6px;font-size:13px}
.dz.over{background:rgba(212,175,55,.12)}
.th{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:8px}
.th div{position:relative}.th img{width:84px;height:84px;object-fit:cover;border-radius:8px;border:1px solid var(--line);display:block}
.th b{position:absolute;top:3px;right:3px;background:#000c;color:var(--ac);border-radius:50%;width:20px;height:20px;line-height:19px;font-size:14px;cursor:pointer}
.noimg .rd{display:none}
#err{position:fixed;left:8px;right:8px;bottom:calc(8px + env(safe-area-inset-bottom,0px));z-index:9;background:#2a0f0f;border:1px solid var(--rd);color:var(--rd);border-radius:10px;padding:10px 12px;font-size:13px}
details{margin-top:14px;border-top:1px solid var(--line);padding-top:10px}summary{color:var(--ac);cursor:pointer;font-weight:600}
.badge{align-self:center;font-size:11px;padding:2px 9px;border:1px solid var(--ac);border-radius:20px;color:var(--ac);white-space:nowrap}
.up{display:inline-block;margin-top:10px;cursor:pointer;padding:9px 14px;font-size:14px}
#modeSeg,#aiBox,#pol,.rd{display:none!important}
</style>
</head>
<body>
<header>
  <div><a href="modul.html?m=3" style="color:var(--ac);font-size:13px">&lsaquo; Kembali ke modul</a><h1><b>VB</b>Prompt Studio</h1><p id="hsub"></p></div>
  <div class="seg" id="langSeg"><button data-l="id" class="on">Bahasa Indonesia</button><button data-l="en">English</button></div>
</header>
<main>
<div>
  <section>
    <h2 data-t="secTarget"></h2>
    <div class="seg" id="tgtSeg"><button data-g="seedance" class="on">Seedance 2.5</button><button data-g="flow">Flow (Veo)</button><button data-g="omni">Omni Flash 1.1</button><button data-g="kling">Kling 4.0</button><button data-g="himax">Himax</button></div>
    <label data-t="inMode"></label>
    <div class="seg" id="inSeg"><button data-i="t2v" class="on">Text-to-Video</button><button data-i="i2v">Image-to-Video</button></div>
    <div class="row"><div><label data-t="per"></label><select id="per"><option>5</option><option>10</option><option>15</option><option>30</option></select></div>
    <div><label data-t="total"></label><input id="total" type="number" min="4" max="600" value="30"></div></div>
    <p class="note" id="tgtNote"></p>
  </section>

  <section>
    <h2 data-t="secStory"></h2>
    <div class="seg" id="modeSeg"><button data-m="self" class="on" data-t="self"></button><button data-m="ai" data-t="ai"></button></div>
    <div id="aiBox" class="hide">
      <p class="note" data-t="aiInfo"></p>
      <label data-t="idea"></label>
      <textarea id="idea"></textarea>
      <label class="sw" style="margin-top:10px"><input type="checkbox" id="four" checked><span data-t="four"></span></label>
      <button class="btn" id="aiBtn" style="margin-top:10px" data-t="aiBtn"></button>
      <p class="note" id="aiSt"></p>
    </div>
    <details><summary data-t="imp"></summary><p class="note" data-t="impInfo"></p>
      <button class="btn ghost" id="impCopy" data-t="impCopy"></button>
      <label data-t="impLbl"></label><textarea id="impT"></textarea>
      <button class="btn" id="impB" style="margin-top:8px" data-t="impBtn"></button><p class="note" id="impSt"></p></details>
    <label data-t="loc"></label><textarea id="loc"></textarea>
    <div class="row">
      <div><label data-t="genre"></label><input id="genre"></div>
      <div><label data-t="preset"></label><select id="preset"></select></div>
    </div>
    <label data-t="sub"></label><input id="sub">
    <label data-t="ratio"></label>
    <select id="ratio"><option value="16:9">16:9 — Landscape</option><option value="9:16">9:16 — Portrait</option><option value="1:1">1:1 — Square</option><option value="4:3">4:3</option><option value="3:4">3:4</option><option value="21:9">21:9 — Ultrawide</option></select>
  </section>

  <section>
    <h2 data-t="secLook"></h2>
    <div class="row"><div><label data-t="cam"></label><select id="cam"></select></div><div><label data-t="look"></label><select id="look"></select></div></div>
    <label data-t="light"></label><select id="light"></select>
    <label data-t="neg"></label><textarea id="neg"></textarea>
  </section>
  <section id="i2vBox" class="hide">
    <h2 data-t="secI2V"></h2>
    <p class="note" data-t="i2vInfo"></p>
    <div class="dz" id="dz-start"><p data-t="dropS" style="margin:0"></p><div class="th"></div></div>
    <button class="btn ghost rd" id="rd-start" style="margin-top:8px" data-t="rdS"></button>
    <label data-t="img"></label><textarea id="img"></textarea>
    <label class="sw" style="margin-top:10px"><input type="checkbox" id="endOn"><span data-t="endOn"></span></label>
    <div id="endBox" class="hide"><div class="dz" id="dz-end"><p data-t="dropE" style="margin:0"></p><div class="th"></div></div>
    <button class="btn ghost rd" id="rd-end" style="margin-top:8px" data-t="rdE"></button><label data-t="endDesc"></label><textarea id="endDesc"></textarea></div>
  </section>
  <section>
    <h2 data-t="secDlg"></h2>
    <label class="sw"><input type="checkbox" id="noDlg"><span data-t="noDlg"></span></label>
    <div id="dlgBox"><label data-t="dlgLbl"></label><textarea id="dlg"></textarea>
    <label data-t="dlgLang"></label><input id="dlgLang" placeholder="Indonesian"></div>
  </section>

  <section>
    <h2 data-t="secChar"></h2>
    <div id="chars"></div><button class="add" id="addC" data-t="addC"></button>
    <label style="margin-top:16px;color:var(--ac);font-weight:600" data-t="timeline"></label>
    <div id="tl"></div><button class="add" id="addT" data-t="addT"></button>
  </section>

  <section>
    <h2 data-t="secExtra"></h2>
    <label data-t="sound"></label><textarea id="sound"></textarea>
    <label data-t="cont"></label><textarea id="cont"></textarea>
    <div id="refBox"><label data-t="refs"></label><textarea id="refs"></textarea>
    <div class="dz" id="dz-refs"><p data-t="dropR" style="margin:0"></p><div class="th"></div></div>
    <button class="btn ghost rd" id="rd-refs" style="margin-top:8px" data-t="rdR"></button></div>
  </section>
</div>

<div class="out">
  <section>
    <div class="bar"><h2 style="margin:0" data-t="outTitle"></h2>
      <div><button class="btn ghost" id="cp" data-t="copy"></button><button class="btn ghost" id="dl" data-t="dl"></button></div></div>
    <textarea id="out"></textarea>
    <div id="clipBtns" class="bar" style="justify-content:flex-start;gap:8px;margin:10px 0 0"></div>
    <div class="bar" style="margin:12px 0 0"><button class="btn" id="gen" data-t="gen"></button><button class="btn ghost" id="pol" data-t="pol"></button></div>
    <p class="note" id="st"></p>
  </section>
</div>
</main>

<div id="err" class="hide"></div>
<script>
const claude={use:async()=>null};
const T={
id:{hsub:"Generator prompt video sinematik untuk Seedance dan Flow",secTarget:"Target Model",secStory:"Dasar Cerita",self:"Isi Sendiri",ai:"Buat dengan AI",aiInfo:"AI akan membuatkan lokasi, karakter, alur waktu, dialog, suara, dan aturan kontinuitas dalam bahasa antarmuka ini.",idea:"Ide Cerita Singkat (opsional)",aiBtn:"Buatkan dengan AI",loc:"Lokasi & Suasana",genre:"Genre / Nada",dur:"Durasi (detik)",ratio:"Rasio Aspek",secDlg:"Dialog",noDlg:"Tanpa Dialog (Aksi Saja)",dlgLbl:"Dialog (satu baris per ucapan, format Nama: ucapan)",dlgLang:"Bahasa ucapan",secChar:"Karakter & Alur Waktu",addC:"+ Tambah Karakter",timeline:"Alur Waktu (Timeline)",addT:"+ Tambah Adegan",secExtra:"Suara, Kontinuitas & Referensi",sound:"Desain suara (musik, ambience, SFX)",cont:"Aturan kontinuitas",refs:"Referensi (satu per baris, mis. Image 1 = wajah karakter utama; Video 1 = gerak kamera)",outTitle:"Prompt Dihasilkan (Bahasa Inggris)",copy:"Salin",dl:"Unduh .txt",gen:"Buat Prompt",pol:"Poles & terjemahkan (AI)",role:"Peran / Nama",age:"Usia (mis. 30-an)",desc:"Deskripsi fisik, pakaian & aksesoris",pers:"Kepribadian & perilaku (opsional)",time:"mis. 0-5 detik",act:"Aksi visual pada adegan ini...",del:"Hapus",empty:"Isi form lalu klik \"Buat Prompt\" untuk melihat hasilnya di sini.",copied:"Tersalin.",fail:"Gagal:",busy:"AI sedang bekerja...",done:"Selesai. Periksa hasilnya sebelum dipakai.",needIdea:"Isi ide cerita dulu, atau kosongkan agar AI berimprovisasi.",cap:"Maks detik per scene (bisa diubah)",tS:"Seedance: durasi 4-30 dtk sekali jalan, timeline per rentang waktu, referensi gambar/video dipetakan eksplisit.",tM:"Model per-scene: setiap baris timeline jadi satu prompt terpisah. Batas detik per scene bisa kamu ubah; nilai bertanda (?) belum terverifikasi.",over:"Peringatan: scene melebihi batas",gaps:" detik",inMode:"Mode input",per:"Durasi per scene (detik)",total:"Total durasi cerita (detik)",preset:"Preset genre",secLook:"Kamera & Gaya Visual",cam:"Gerakan kamera",look:"Gaya visual",light:"Pencahayaan",neg:"Hindari (negative prompt)",secI2V:"Image-to-Video",i2vInfo:"Unggah gambar di generator, lalu jelaskan isi dan perannya di sini. Prompt hanya berisi gerakan; gambar mengunci identitas dan tampilan.",img:"Gambar awal (frame pertama): isi & perannya",endOn:"Pakai frame akhir (gambar kedua)",endDesc:"Frame akhir: isinya",copyClip:"Salin Clip",clipsWord:"klip",imp:"Isi form dari chat AI (opsional)",impInfo:"Mau gambar dibacakan AI? Salin instruksi, tempel di chat AI (Gemini, dll) bersama foto, lalu tempel balasan JSON-nya di bawah.",impCopy:"Salin instruksi untuk chat",impLbl:"Tempel balasan JSON dari chat",impBtn:"Isi form dari JSON",impOk:"Form terisi.",impBad:"JSON tidak terbaca. Salin seluruh blok balasan.",copied2:"Instruksi tersalin.",sub:"Subgenre",four:"Struktur 4 elemen: Hook, Retensi, Engagement, CTA",idea:"Judul / ide cerita (cukup judulnya saja)",aiInfo:"AI membuat semuanya dari judul: cerita, karakter, timeline, kamera, gaya visual, pencahayaan, genre & subgenre, rasio, dialog, suara, dan negative prompt.",upload:"Upload foto/file",badFile:"Format tidak didukung. Pakai JPG, PNG, WebP, atau GIF.",dropS:"Seret gambar awal ke sini, atau klik untuk memilih",dropE:"Seret gambar akhir ke sini, atau klik untuk memilih",dropR:"Seret gambar referensi (bisa banyak) ke sini, atau klik",rdS:"Baca gambar & isi form",rdE:"Baca gambar akhir",rdR:"Baca referensi & beri label",noImg:"Baca gambar tidak tersedia di tampilan ini. Isi deskripsi manual.",noFile:"Tambahkan gambar dulu.",tM:"Cerita yang lebih panjang dari durasi per scene otomatis dipecah jadi beberapa klip; tiap klip berisi prompt lengkap yang berdiri sendiri."},
en:{hsub:"Cinematic video prompt generator for Seedance and Flow",secTarget:"Target Model",secStory:"Story Basics",self:"Write It Myself",ai:"Generate with AI",aiInfo:"AI will create the location, characters, timeline, dialogue, sound and continuity rules in this interface language.",idea:"Short Story Idea (optional)",aiBtn:"Generate with AI",loc:"Location & Mood",genre:"Genre / Tone",dur:"Duration (seconds)",ratio:"Aspect Ratio",secDlg:"Dialogue",noDlg:"No Dialogue (Action Only)",dlgLbl:"Dialogue (one line per utterance, format Name: line)",dlgLang:"Spoken language",secChar:"Characters & Timeline",addC:"+ Add Character",timeline:"Timeline",addT:"+ Add Scene",secExtra:"Sound, Continuity & References",sound:"Sound design (music, ambience, SFX)",cont:"Continuity rules",refs:"References (one per line, e.g. Image 1 = lead character face; Video 1 = camera movement)",outTitle:"Generated Prompt (English)",copy:"Copy",dl:"Download .txt",gen:"Create Prompt",pol:"Polish & translate (AI)",role:"Role / Name",age:"Age (e.g. 30s)",desc:"Physical description, clothing & accessories",pers:"Personality & behavior (optional)",time:"e.g. 0-5 sec",act:"Visual action in this scene...",del:"Delete",empty:"Fill the form, then click \"Create Prompt\" to see the result here.",copied:"Copied.",fail:"Failed:",busy:"AI is working...",done:"Done. Review the result before using it.",needIdea:"Add a story idea first, or leave it empty for AI to improvise.",cap:"Max seconds per scene (editable)",tS:"Seedance: 4-30s in one go, time-ranged timeline, image/video references mapped explicitly.",tM:"Per-scene model: each timeline row becomes its own prompt. The per-scene cap is editable; values marked (?) are unverified.",over:"Warning: scene exceeds cap",gaps:" sec",inMode:"Input mode",per:"Duration per scene (seconds)",total:"Total story length (seconds)",preset:"Genre preset",secLook:"Camera & Visual Style",cam:"Camera movement",look:"Visual style",light:"Lighting",neg:"Avoid (negative prompt)",secI2V:"Image-to-Video",i2vInfo:"Upload the image in the generator, then describe its content and role here. The prompt covers motion only; the image locks identity and look.",img:"Start image (first frame): content & role",endOn:"Use an end frame (second image)",endDesc:"End frame: content",copyClip:"Copy Clip",clipsWord:"clips",imp:"Fill the form from an AI chat (optional)",impInfo:"Want an AI to read your image? Copy the instruction, paste it in an AI chat (Gemini, etc.) with your photos, then paste the JSON reply below.",impCopy:"Copy instruction for chat",impLbl:"Paste the JSON reply from chat",impBtn:"Fill form from JSON",impOk:"Form filled.",impBad:"Could not read the JSON. Copy the whole reply block.",copied2:"Instruction copied.",sub:"Subgenre",four:"4-element structure: Hook, Retention, Engagement, CTA",idea:"Title / story idea (the title alone is enough)",aiInfo:"AI builds everything from the title: story, characters, timeline, camera, visual style, lighting, genre & subgenre, ratio, dialogue, sound and negative prompt.",upload:"Upload photo/file",badFile:"Unsupported format. Use JPG, PNG, WebP or GIF.",dropS:"Drop the start image here, or click to choose",dropE:"Drop the end image here, or click to choose",dropR:"Drop reference images (several allowed) here, or click",rdS:"Read image & fill form",rdE:"Read end image",rdR:"Read references & label them",noImg:"Image reading is not available in this view. Describe it manually.",noFile:"Add an image first.",tM:"Stories longer than the per-scene duration are split into several clips automatically; each clip is a complete, standalone prompt."}};
let L="id",G="seedance",M="self",IM="t2v";
const EL={hook:["Hook","Hook"],retention:["Retensi","Retention"],engagement:["Engagement","Engagement"],cta:["CTA","CTA"]};
const DEFPER={seedance:30,flow:10,omni:10,kling:15,himax:10};
const CAP={flow:8,omni:10,kling:15,himax:6},NM={flow:"Google Flow (Veo)",omni:"Omni Flash 1.1",kling:"Kling 4.0",himax:"Himax"},UNV={flow:1,kling:1,himax:1};
const isM=()=>G!=="seedance";
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const t=k=>T[L][k];
const DEF_CONT={id:"Pertahankan wajah, pakaian, warna, dan skala semua karakter identik di setiap detik. Lokasi, pencahayaan, dan arah gerak konsisten. Tanpa teks, subtitle, atau watermark.",en:"Keep every character's face, clothing, colors and scale identical throughout. Location, lighting and screen direction stay consistent. No text, subtitles or watermarks."};

function applyLang(){
  document.documentElement.lang=L;
  $("#hsub").textContent=t("hsub");
  $$("[data-t]").forEach(e=>e.textContent=t(e.dataset.t));
  $$(".seg#langSeg button").forEach(b=>b.classList.toggle("on",b.dataset.l===L));
  $$("#chars input,#chars textarea,#tl input,#tl textarea").forEach(e=>e.placeholder=t(e.dataset.p));
  $$("#chars .del,#tl .del").forEach(e=>e.textContent=t("del"));
  tgtUI();
  $$("#tl .badge").forEach(b=>b.textContent=EL[b.dataset.el][L==="id"?0:1]);
  $("#out").placeholder=t("empty");
  if(!$("#cont").dataset.touched)$("#cont").value=DEF_CONT[L];
}
function tgtUI(){$("#tgtNote").textContent=(G==="seedance"?t("tS")+" ":"")+t("tM")}
function mk(tag,p,key,extra){const e=document.createElement(tag);e.dataset.p=key;e.placeholder=t(key);e.className=extra||"";return e}
function addChar(v={}){
  const d=document.createElement("div");d.className="item";
  const top=document.createElement("div");top.className="top";
  const r=mk("input",0,"role");r.value=v.role||"";r.dataset.f="role";
  const x=document.createElement("button");x.className="del";x.textContent=t("del");x.onclick=()=>d.remove();
  top.append(r,x);
  const a=mk("input",0,"age");a.value=v.age||"";a.dataset.f="age";
  const ds=mk("textarea",0,"desc");ds.value=v.desc||"";ds.dataset.f="desc";
  const p=mk("textarea",0,"pers");p.value=v.personality||"";p.dataset.f="pers";
  d.append(top,a,ds,p);$("#chars").append(d);
}
function addTime(v={}){
  const d=document.createElement("div");d.className="item";
  const top=document.createElement("div");top.className="top";
  const r=mk("input",0,"time");r.value=v.time||"";r.dataset.f="time";
  const x=document.createElement("button");x.className="del";x.textContent=t("del");x.onclick=()=>d.remove();
  top.append(r,x);
  if(v.el&&EL[v.el]){const b=document.createElement("span");b.className="badge";b.dataset.el=v.el;b.textContent=EL[v.el][L==="id"?0:1];top.prepend(b)}
  const a=mk("textarea",0,"act");a.value=v.action||"";a.dataset.f="act";
  d.append(top,a);$("#tl").append(d);
}
const val=(el,f)=>el.querySelector(`[data-f=${f}]`).value.trim();
const PRE=[["Action","High-octane action, kinetic and physical, practical stunts"],["Action-comedy","Action-comedy, slapstick timing, exaggerated reactions"],["Horror","Slow-burn horror, dread, deep shadows, sudden scares"],["Thriller","Tense thriller, paranoia, tight framing"],["Drama","Emotional drama, intimate, naturalistic performances"],["Sci-Fi","Grand sci-fi, futuristic technology, epic scale"],["Fantasy","Epic fantasy, magical, sweeping landscapes"],["Romance","Warm romance, soft glow, tender close-ups"],["Comedy","Light comedy, playful, bright and punchy"],["Cyberpunk","Neon cyberpunk, rain-soaked streets, holograms"],["Monster / Kaiju","Giant monster disaster spectacle, massive scale, city destruction"],["Documentary","Observational documentary, handheld, natural light"],["Product ad","Premium product commercial, glossy, macro details"],["UGC / Vlog","Authentic UGC smartphone vlog, casual, selfie framing"],["Music video","Stylized music video, rhythmic cuts, bold color"]];
const CAM=["Auto","Static tripod shot","Slow dolly-in","Handheld, slightly shaky","Smooth 360-degree orbit","Drone aerial sweep","Tracking shot following the subject","Whip pan transitions","Crane shot rising up","First-person POV"];
const LOOK=["Auto","Cinematic 35mm film, shallow depth of field","Anamorphic widescreen, lens flares","Photorealistic, documentary realism","Anime cel-shaded","3D animated feature look","Smartphone UGC footage","Black-and-white film noir","Neon-soaked cyberpunk grade"];
const LIGHT=["Auto","Golden hour","Blue hour twilight","Night with neon practicals","Soft overcast daylight","Harsh midday sun","Low-key dramatic contrast","Studio softbox lighting"];
const opt=(id,a)=>{$(id).innerHTML=a.map((x,i)=>Array.isArray(x)?`<option value="${x[1]}">${x[0]}</option>`:`<option value="${i?x:""}">${x}</option>`).join("")};
function collect(){
  return{
    loc:$("#loc").value.trim(),genre:$("#genre").value.trim(),sub:$("#sub").value.trim(),
    total:Math.max(4,parseInt($("#total").value)||30),per:+$("#per").value||10,ratio:$("#ratio").value,
    noDlg:$("#noDlg").checked,dlg:$("#dlg").value.trim(),dlgLang:$("#dlgLang").value.trim(),
    chars:$$("#chars .item").map(e=>({role:val(e,"role"),age:val(e,"age"),desc:val(e,"desc"),pers:val(e,"pers")})).filter(c=>c.role||c.desc),
    tl:$$("#tl .item").map(e=>({time:val(e,"time"),act:val(e,"act")})).filter(s=>s.act),
    sound:$("#sound").value.trim(),cont:$("#cont").value.trim(),refs:$("#refs").value.trim(),
    cam:$("#cam").value,look:$("#look").value,light:$("#light").value,neg:$("#neg").value.trim(),
    img:$("#img").value.trim(),endOn:$("#endOn").checked,endDesc:$("#endDesc").value.trim()
  };
}
function build(){
  const s=collect(),per=s.per,total=s.total,n=Math.max(1,Math.ceil(total/per)),i2v=IM==="i2v";
  const chars=s.chars.map(c=>`- ${c.role}${c.age?` (${c.age})`:""}: ${c.desc}${c.pers?` Personality/behavior: ${c.pers}`:""}`);
  const dl=s.noDlg?[]:s.dlg.split("\n").filter(Boolean).map(l=>{const i=l.indexOf(":");return i>0?`${l.slice(0,i).trim()} says${s.dlgLang?` in ${s.dlgLang}`:""}: "${l.slice(i+1).trim().replace(/^"|"$/g,"")}"`:l});
  const g=[`Target model: ${NM[G]||"Seedance 2.5"}. ${i2v?"Image-to-video":"Text-to-video"}. Aspect ratio ${s.ratio}. Genre/tone: ${s.genre||"cinematic"}${s.sub?` (${s.sub})`:""}.`];
  if(s.loc)g.push(`LOCATION & MOOD:\n${s.loc}`);
  const look=[s.cam&&`Camera: ${s.cam}`,s.look&&`Look: ${s.look}`,s.light&&`Lighting: ${s.light}`].filter(Boolean);
  if(look.length)g.push(look.join(". ")+".");
  if(chars.length)g.push(`${i2v?"IDENTITY (must match the attached image)":"CHARACTERS"}:\n${chars.join("\n")}`);
  if(i2v)g.push(`IMAGE INPUT: Use the attached first image as the exact starting frame and visual source${s.img?`: ${s.img}`:""}. Preserve identity, proportions, colors, clothing, environment and composition. Animate only; do not redesign or replace the subject.`);
  if(s.refs)g.push(`REFERENCES:\n${s.refs.split("\n").filter(Boolean).map(r=>"- "+r).join("\n")}\nUse the attached references as authoritative inputs. Images define exact identity, proportions, colors, clothing and composition; videos define motion, timing and camera movement. Preserve reference details and do not substitute generic lookalikes.`);
  if(s.sound)g.push(`SOUND DESIGN:\n${s.sound}`);
  if(s.noDlg)g.push("No dialogue. Action and sound only; no speech, no voice-over.");
  if(s.cont)g.push(`CONTINUITY:\n${s.cont}`);
  if(s.neg)g.push(`AVOID: ${s.neg}`);
  const base=g.join("\n\n");
  const tl=s.tl.map((x,i)=>{const m=(x.time||"").match(/(\d+(?:\.\d+)?)\s*[-–]\s*(\d+(?:\.\d+)?)/);return{...x,a:m?+m[1]:null,b:m?+m[2]:null,i}});
  const timed=tl.length>0&&tl.every(x=>x.a!==null);
  const clipOf=x=>timed?Math.min(n-1,Math.floor(x.a/per)):Math.min(n-1,Math.floor(x.i*n/tl.length));
  const out=[];
  for(let k=0;k<n;k++){
    const cs=k*per,len=Math.min(total,cs+per)-cs;
    const rows=tl.filter(x=>clipOf(x)===k).map(x=>{const lab=timed?`${Math.max(0,x.a-cs)}-${Math.min(len,x.b-cs)}s`:(x.time||"");return `${lab?lab+": ":""}${x.act}`});
    const c=[k===0?(i2v?"START: the attached first image is frame 1.":"START: open the scene as described in the timeline."):"START: continue seamlessly from the last frame of the previous clip (use it as the start image if the model allows). Same characters, wardrobe, lighting and camera language, no visible cut."];
    if(rows.length)c.push(`TIMELINE (${len} seconds):\n${rows.join("\n")}`);
    const lines=dl.filter((_,j)=>Math.min(n-1,Math.floor(j*n/dl.length))===k);
    if(lines.length)c.push(`DIALOGUE:\n${lines.join("\n")}`);
    if(k<n-1)c.push("END: finish on a stable, clean frame that can start the next clip.");
    else if(i2v&&s.endOn)c.push(`END: the attached last image is the exact final frame${s.endDesc?`: ${s.endDesc}`:""}. The motion must arrive on it.`);
    out.push(`═══ CLIP ${k+1}/${n} · ${len}s ═══\n${base}\n\n${c.join("\n\n")}`);
  }
  $("#st").textContent=`${n} ${t("clipsWord")} × ${per}${t("gaps")}`;
  return out.join("\n\n");
}
function renderClips(){
  const p=$("#out").value.split(/\n(?=═+ CLIP )/).filter(x=>x.startsWith("═")),b=$("#clipBtns");b.innerHTML="";
  if(p.length<2)return;
  p.forEach((x,i)=>{const e=document.createElement("button");e.className="btn ghost";e.textContent=`${t("copyClip")} ${i+1}`;
    e.onclick=async()=>{try{await navigator.clipboard.writeText(x)}catch(_){const a=document.createElement("textarea");a.value=x;document.body.append(a);a.select();document.execCommand("copy");a.remove()}$("#st").textContent=t("copied")};b.append(e)});
}

const DEFNEG="subtitles, on-screen text, watermark, logo, morphing faces, extra fingers, flicker";
const OPTS=id=>[...$(id).options].map(o=>o.value).filter(Boolean);
function storyPrompt(idea,dur,hasImg,four,withImg){
  const lang=L==="id"?"Indonesian":"English";
  return `You are a short-form video director. ${idea?`Title/idea: "${idea}".`:"No idea given: invent an original, attention-grabbing one."} ${hasImg?"The attached images are references (start image first): keep characters, look and setting consistent with them. ":""}${withImg?"The first attached image is frame 1; the timeline must start from exactly that frame. ":""}Write ALL text values in ${lang}. Total length ${dur} seconds. ${four?`Structure the timeline with four elements in this order: "hook" (grabs attention within the first 3 seconds), "retention" (keeps viewers watching: escalating tension, open loops, reveals), "engagement" (a moment that triggers comments, shares or saves: twist, relatable beat, provocative question), "cta" (closing payoff plus a call to action, spoken or shown visually, never as on-screen text). Give every row its element. `:""}Return ONLY JSON: {${withImg?'"image":"what the first image shows and its role as frame 1, 1-2 sentences",':""}"location":str,"genre":str,"subgenre":str,"ratio":one of ${JSON.stringify(OPTS("#ratio"))},"camera":exactly one of ${JSON.stringify(OPTS("#cam"))},"look":exactly one of ${JSON.stringify(OPTS("#look"))},"lighting":exactly one of ${JSON.stringify(OPTS("#light"))},"negative":"comma-separated list tailored to this story","characters":[{"role":str,"age":str,"desc":"very specific and reusable: face, hair, body, clothing, accessories","personality":str}],"timeline":[{"time":"0-3","element":"hook|retention|engagement|cta|","action":"concrete filmable action with camera and sound cues"}],"dialogue":"lines as Name: line, or empty string for none","spokenLanguage":str,"sound":str,"continuity":str}. Max 3 characters. Timeline: 5-9 rows with second ranges covering the full ${dur} seconds without gaps.`;
}
function applyStory(r,over){
  const put=(sel,v)=>{if(v&&(over||!$(sel).value.trim()))$(sel).value=v};
  const pick=(sel,v)=>{if(v&&(over||!$(sel).value)&&[...$(sel).options].some(o=>o.value===v))$(sel).value=v};
  put("#loc",r.location);put("#genre",r.genre);put("#sub",r.subgenre);put("#sound",r.sound);
  if([...$("#ratio").options].some(o=>o.value===r.ratio))$("#ratio").value=r.ratio;
  pick("#cam",r.camera);pick("#look",r.look);pick("#light",r.lighting);
  if(r.negative&&(over||$("#neg").value.trim()===DEFNEG))$("#neg").value=r.negative;
  if(r.continuity&&(over||!$("#cont").dataset.touched)){$("#cont").value=r.continuity;$("#cont").dataset.touched=1}
  if((r.characters||[]).length&&(over||!collect().chars.length)){$("#chars").innerHTML="";r.characters.forEach(c=>addChar({role:c.role,age:c.age,desc:c.desc,personality:c.personality}))}
  if((r.timeline||[]).length&&(over||!collect().tl.length)){$("#tl").innerHTML="";r.timeline.forEach(x=>addTime({time:x.time,action:x.action,el:(x.element||"").toLowerCase()}))}
  if(over){$("#dlg").value=r.dialogue||"";$("#noDlg").checked=!r.dialogue;$("#dlgLang").value=r.spokenLanguage||"";toggleDlg()}
}
async function aiFill(){
